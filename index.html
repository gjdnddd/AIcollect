<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 정보통합 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ===== [VARS] 색상·치수 변수 ===== */
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --text: #1f2328;
  --muted: #6b7280;
  --accent: #2563eb;
  --accent-soft: #eff4ff;
  --border: #e5e7eb;
  --code-bg: #f1f3f5;
  --sidebar-w: 270px;
  --header-h: 52px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.65;
}

/* ===== [HEADER] 상단바 ===== */
header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
  background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 0 16px; z-index: 30;
}
header h1 { font-size: 16px; font-weight: 700; }
#menuBtn {
  display: none; background: none; border: 1px solid var(--border);
  border-radius: 6px; width: 34px; height: 34px; font-size: 18px; cursor: pointer;
}
#homeBtn {
  margin-left: auto; background: none; border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text);
}
#homeBtn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ===== [SIDEBAR] 그룹 + 아이템 + 목차 ===== */
#sidebar {
  position: fixed; top: var(--header-h); bottom: 0; left: 0; width: var(--sidebar-w);
  background: var(--panel); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 10px 8px; z-index: 20;
}

/* ===== [SEARCH] 검색창 ===== */
#searchWrap { padding: 4px 4px 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
#searchInput {
  width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid var(--border);
  border-radius: 6px; outline: none; margin-bottom: 6px;
}
#searchInput:focus { border-color: var(--accent); }
.search-opt { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.search-opt input { cursor: pointer; }
.search-empty { padding: 14px 10px; font-size: 12.5px; color: var(--muted); }

/* 그룹 헤더 */
.group-header {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 8px; border-radius: 5px; margin-top: 4px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted);
  cursor: pointer; user-select: none;
}
.group-header:hover { background: var(--bg); color: var(--text); }
.group-arrow { font-size: 9px; transition: transform .15s; display: inline-block; }
.group-arrow.open { transform: rotate(90deg); }

/* 그룹 아이템 래퍼 */
.group-items { margin-bottom: 4px; }
.group-items.collapsed { display: none; }

/* 카테고리 버튼 */
.cat {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 8px 10px 8px 20px; border-radius: 6px;
  font-size: 13.5px; font-weight: 500; color: var(--text); cursor: pointer;
}
.cat:hover { background: var(--bg); }
.cat.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* 목차 */
.toc { margin: 2px 0 6px 20px; }
.toc a {
  display: block; padding: 4px 10px; font-size: 12.5px; color: var(--muted);
  text-decoration: none; border-left: 2px solid var(--border);
}
.toc a:hover { color: var(--accent); border-left-color: var(--accent); }

/* ===== [MAIN] 본문 ===== */
main {
  margin-left: var(--sidebar-w); padding: calc(var(--header-h) + 24px) 32px 80px;
  max-width: 940px;
}
#content {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 32px 36px;
}
#content h1 { font-size: 24px; margin: 4px 0 16px; }
#content h2 {
  font-size: 19px; margin: 28px 0 12px; padding-top: 14px;
  border-top: 1px solid var(--border);
}
#content h3 { font-size: 16px; margin: 18px 0 8px; }
#content h4 { font-size: 14px; margin: 14px 0 6px; }
#content p, #content li { font-size: 14.5px; }
#content ul, #content ol { padding-left: 22px; margin: 8px 0; }
#content blockquote {
  border-left: 3px solid var(--accent); background: var(--accent-soft);
  padding: 8px 14px; margin: 12px 0; color: #374151; border-radius: 0 6px 6px 0;
}
#content code {
  background: var(--code-bg); padding: 1.5px 5px; border-radius: 4px;
  font-size: 13px; font-family: "Consolas", "D2Coding", monospace;
}
#content pre {
  background: var(--code-bg); padding: 14px 16px; border-radius: 8px;
  overflow-x: auto; margin: 12px 0;
}
#content pre code { background: none; padding: 0; }
#content table {
  border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13.5px;
}
#content th, #content td {
  border: 1px solid var(--border); padding: 7px 10px; text-align: left;
}
#content th { background: var(--bg); }
#content a { color: var(--accent); }

/* ===== [BACKDROP] 모바일 사이드바 배경 ===== */
#backdrop {
  display: none; position: fixed; inset: var(--header-h) 0 0 0;
  background: rgba(0,0,0,0.35); z-index: 15;
}

/* ===== [HOME] 목록 페이지 ===== */
.home-group { margin-bottom: 22px; }
.home-group h2 {
  font-size: 15px; margin-bottom: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.05em; border: none; padding-top: 0;
}
.home-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.home-card {
  display: block; text-align: left; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--text);
  cursor: pointer; text-decoration: none;
}
.home-card:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ===== [RESPONSIVE] 모바일 ===== */
@media (max-width: 760px) {
  #menuBtn { display: block; }
  #sidebar { transform: translateX(-100%); transition: transform .2s; }
  #sidebar.open { transform: translateX(0); }
  #backdrop.open { display: block; }
  main { margin-left: 0; padding: calc(var(--header-h) + 16px) 14px 60px; }
  #content { padding: 20px 18px; border-radius: 8px; }
}
</style>
</head>
<body>

<header>
  <button id="menuBtn" aria-label="메뉴">&#9776;</button>
  <h1>AI 정보통합 대시보드</h1>
  <button id="homeBtn">🏠 목록</button>
</header>

<nav id="sidebar"></nav>
<div id="backdrop"></div>

<main>
  <div id="content">불러오는 중…</div>
</main>

<script>
/* ===== [STATE] 전역 상태 ===== */
const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');
const backdrop = document.getElementById('backdrop');
let groups = [];
let activeGi = -1;
let activeIi = -1;
const collapsedGroups = new Set(); /* 기본값: 전부 접힘 */
let searchQuery = '';
let searchBody = false;
let indexing = false;
const docCache = {}; /* file -> text (본문 검색용 캐시) */

/* ===== [INIT] files.json 로드 ===== */
async function init() {
  try {
    const res = await fetch('files.json?' + Date.now());
    groups = (await res.json()).groups;
  } catch (e) {
    content.textContent = 'files.json을 불러오지 못했습니다.';
    return;
  }
  groups.forEach((g, gi) => collapsedGroups.add(gi)); /* 전부 접힌 상태로 시작 */
  renderSidebar();
  if (groups.length && groups[0].items.length) openItem(0, 0);
}

/* ===== [SEARCH] 검색어 매칭 ===== */
function matchesItem(item) {
  const q = searchQuery.trim().toLowerCase();
  if (!q) return true;
  if (item.title.toLowerCase().includes(q)) return true;
  if (searchBody && docCache[item.file] && docCache[item.file].toLowerCase().includes(q)) return true;
  return false;
}

/* ===== [SEARCH] 본문 전체 인덱싱 (최초 1회) ===== */
async function ensureIndexed() {
  if (Object.keys(docCache).length > 0) return;
  indexing = true;
  renderSidebar();
  const tasks = [];
  groups.forEach(g => g.items.forEach(item => {
    tasks.push(
      fetch(item.file + '?' + Date.now())
        .then(r => r.text())
        .then(t => { docCache[item.file] = t; })
        .catch(() => { docCache[item.file] = ''; })
    );
  }));
  await Promise.all(tasks);
  indexing = false;
  renderSidebar();
}

/* ===== [SIDEBAR] 그룹+아이템 렌더 ===== */
function renderSidebar() {
  sidebar.innerHTML = '';

  /* 검색창 */
  const searchWrap = document.createElement('div');
  searchWrap.id = 'searchWrap';
  const input = document.createElement('input');
  input.id = 'searchInput';
  input.placeholder = indexing ? '본문 인덱싱 중…' : '검색어 입력…';
  input.value = searchQuery;
  input.disabled = indexing;
  input.oninput = (e) => { searchQuery = e.target.value; renderSidebar(); };
  searchWrap.appendChild(input);

  const optLabel = document.createElement('label');
  optLabel.className = 'search-opt';
  const optCheck = document.createElement('input');
  optCheck.type = 'checkbox';
  optCheck.checked = searchBody;
  optCheck.onchange = async (e) => {
    searchBody = e.target.checked;
    if (searchBody) await ensureIndexed();
    renderSidebar();
  };
  optLabel.appendChild(optCheck);
  optLabel.appendChild(document.createTextNode(' 본문 포함 검색'));
  searchWrap.appendChild(optLabel);
  sidebar.appendChild(searchWrap);

  const isSearching = searchQuery.trim().length > 0;
  let totalMatches = 0;

  groups.forEach((group, gi) => {
    const visibleItems = group.items
      .map((item, ii) => ({ item, ii }))
      .filter(({ item }) => matchesItem(item));

    if (isSearching && visibleItems.length === 0) return; /* 매칭 없는 그룹은 숨김 */
    totalMatches += visibleItems.length;

    const isCollapsed = isSearching ? false : collapsedGroups.has(gi);

    /* 그룹 헤더 */
    const hdr = document.createElement('div');
    hdr.className = 'group-header';
    const arrow = document.createElement('span');
    arrow.className = 'group-arrow' + (isCollapsed ? '' : ' open');
    arrow.textContent = '▶';
    hdr.appendChild(arrow);
    hdr.appendChild(document.createTextNode(' ' + group.title));
    hdr.onclick = () => toggleGroup(gi);
    sidebar.appendChild(hdr);

    /* 그룹 아이템 */
    const wrap = document.createElement('div');
    wrap.className = 'group-items' + (isCollapsed ? ' collapsed' : '');

    (isSearching ? visibleItems : group.items.map((item, ii) => ({ item, ii }))).forEach(({ item, ii }) => {
      const isActive = gi === activeGi && ii === activeIi;
      const btn = document.createElement('button');
      btn.className = 'cat' + (isActive ? ' active' : '');
      btn.textContent = item.title;
      btn.onclick = () => openItem(gi, ii);
      wrap.appendChild(btn);

      if (isActive) {
        const toc = document.createElement('div');
        toc.className = 'toc';
        toc.id = 'toc';
        wrap.appendChild(toc);
      }
    });

    sidebar.appendChild(wrap);
  });

  if (isSearching && totalMatches === 0) {
    const empty = document.createElement('div');
    empty.className = 'search-empty';
    empty.textContent = '검색 결과가 없습니다.';
    sidebar.appendChild(empty);
  }
}

/* ===== [TOGGLE] 그룹 접기/펼치기 ===== */
function toggleGroup(gi) {
  if (collapsedGroups.has(gi)) collapsedGroups.delete(gi);
  else collapsedGroups.add(gi);
  renderSidebar();
  if (activeGi === gi) buildToc();
}

/* ===== [LOAD] 선택한 아이템 .md 렌더 ===== */
async function openItem(gi, ii) {
  activeGi = gi; activeIi = ii;
  collapsedGroups.delete(gi); /* 해당 그룹 자동 펼침 */
  renderSidebar();
  content.textContent = '불러오는 중…';
  let md;
  try {
    const res = await fetch(groups[gi].items[ii].file + '?' + Date.now());
    md = await res.text();
  } catch (e) {
    content.textContent = '문서를 불러오지 못했습니다.';
    return;
  }
  content.innerHTML = marked.parse(md);
  buildToc();
  window.scrollTo(0, 0);
  closeMenu();
}

/* ===== [HOME] 전체 목록 페이지 ===== */
function renderHome() {
  activeGi = -1; activeIi = -1;
  renderSidebar();
  content.innerHTML = '';

  const title = document.createElement('h1');
  title.textContent = '전체 목록';
  content.appendChild(title);

  groups.forEach((group, gi) => {
    const sec = document.createElement('div');
    sec.className = 'home-group';
    const h2 = document.createElement('h2');
    h2.textContent = group.title;
    sec.appendChild(h2);

    const list = document.createElement('div');
    list.className = 'home-list';
    group.items.forEach((item, ii) => {
      const card = document.createElement('button');
      card.className = 'home-card';
      card.textContent = item.title;
      card.onclick = () => openItem(gi, ii);
      list.appendChild(card);
    });
    sec.appendChild(list);
    content.appendChild(sec);
  });

  window.scrollTo(0, 0);
  closeMenu();
}

/* ===== [TOC] 본문 h2로 목차 생성 ===== */
function buildToc() {
  const toc = document.getElementById('toc');
  if (!toc) return;
  toc.innerHTML = '';
  content.querySelectorAll('h2').forEach((h, n) => {
    const id = 'sec-' + n;
    h.id = id;
    const a = document.createElement('a');
    a.textContent = h.textContent;
    a.href = '#' + id;
    a.onclick = (e) => {
      e.preventDefault();
      document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
      closeMenu();
    };
    toc.appendChild(a);
  });
}

/* ===== [MENU] 모바일 사이드바 토글 ===== */
function closeMenu() {
  sidebar.classList.remove('open');
  backdrop.classList.remove('open');
}
document.getElementById('menuBtn').onclick = () => {
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('open');
};
document.getElementById('homeBtn').onclick = renderHome;
backdrop.onclick = closeMenu;

init();
</script>
</body>
</html>
