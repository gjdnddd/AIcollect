<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 정보통합 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ===== [VARS] 색상·치수 변수 ===== */
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --text: #1f2328;
  --muted: #6b7280;
  --accent: #2563eb;
  --accent-soft: #eff4ff;
  --border: #e5e7eb;
  --code-bg: #f1f3f5;
  --sidebar-w: 270px;
  --header-h: 52px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.65;
}

/* ===== [HEADER] 상단바 ===== */
header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
  background: var(--panel); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; padding: 0 16px; z-index: 30;
}
header h1 { font-size: 16px; font-weight: 700; }
#menuBtn {
  display: none; background: none; border: 1px solid var(--border);
  border-radius: 6px; width: 34px; height: 34px; font-size: 18px; cursor: pointer;
}
#homeBtn {
  margin-left: auto; background: none; border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--text);
}
#homeBtn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ===== [SIDEBAR] 그룹 + 아이템 + 목차 ===== */
#sidebar {
  position: fixed; top: var(--header-h); bottom: 0; left: 0; width: var(--sidebar-w);
  background: var(--panel); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 10px 8px; z-index: 20;
}

/* ===== [SEARCH] 검색창 ===== */
#searchWrap { padding: 4px 4px 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
#searchInput {
  width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid var(--border);
  border-radius: 6px; outline: none; margin-bottom: 6px;
}
#searchInput:focus { border-color: var(--accent); }
.search-opt { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
.search-opt input { cursor: pointer; }
.search-empty { padding: 14px 10px; font-size: 12.5px; color: var(--muted); }

/* 그룹 헤더 */
.group-header {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 8px; border-radius: 5px; margin-top: 4px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted);
  cursor: pointer; user-select: none;
}
.group-header:hover { background: var(--bg); color: var(--text); }
.group-arrow { font-size: 9px; transition: transform .15s; display: inline-block; }
.group-arrow.open { transform: rotate(90deg); }

/* 그룹 아이템 래퍼 */
.group-items { margin-bottom: 4px; }
.group-items.collapsed { display: none; }

/* 카테고리 버튼 */
.cat {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 8px 10px 8px 20px; border-radius: 6px;
  font-size: 13.5px; font-weight: 500; color: var(--text); cursor: pointer;
}
.cat:hover { background: var(--bg); }
.cat.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* 목차 (선택한 문서 옆 ▶ 로 접고 펼침, 기본 접힘) */
.toc-caret { display: inline-block; font-size: 9px; margin-right: 2px; transition: transform .15s; }
.toc-caret.open { transform: rotate(90deg); }
.toc { margin: 2px 0 6px 20px; }
.toc a {
  display: block; padding: 4px 10px; font-size: 12.5px; color: var(--muted);
  text-decoration: none; border-left: 2px solid var(--border);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.toc a:hover { color: var(--accent); border-left-color: var(--accent); }

/* ===== [MAIN] 본문 ===== */
main {
  margin-left: var(--sidebar-w); padding: calc(var(--header-h) + 24px) 32px 80px;
  max-width: 940px;
}
#content {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 32px 36px;
}
#content h1 { font-size: 24px; margin: 4px 0 16px; }
#content h2 {
  font-size: 19px; margin: 28px 0 12px; padding-top: 14px;
  border-top: 1px solid var(--border);
}
#content h3 { font-size: 16px; margin: 18px 0 8px; }
#content h4 { font-size: 14px; margin: 14px 0 6px; }
#content p, #content li { font-size: 14.5px; }
#content ul, #content ol { padding-left: 22px; margin: 8px 0; }
#content blockquote {
  border-left: 3px solid var(--accent); background: var(--accent-soft);
  padding: 8px 14px; margin: 12px 0; color: #374151; border-radius: 0 6px 6px 0;
}
#content code {
  background: var(--code-bg); padding: 1.5px 5px; border-radius: 4px;
  font-size: 13px; font-family: "Consolas", "D2Coding", monospace;
}
#content pre {
  background: var(--code-bg); padding: 14px 16px; border-radius: 8px;
  overflow-x: auto; margin: 12px 0;
}
#content pre code { background: none; padding: 0; }
#content table {
  border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13.5px;
}
#content th, #content td {
  border: 1px solid var(--border); padding: 7px 10px; text-align: left;
}
#content th { background: var(--bg); }
#content a { color: var(--accent); }

/* ===== [PROPS] 문서 맨 앞 속성(YAML) — 접힌 "속성" ===== */
#content details.props {
  margin: 0 0 18px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
}
#content details.props > summary {
  cursor: pointer; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--muted); user-select: none;
}
#content details.props[open] > summary { border-bottom: 1px solid var(--border); }
#content details.props table { margin: 0; border: none; font-size: 12.5px; }
#content details.props th, #content details.props td { border: none; border-bottom: 1px solid var(--border); background: none; padding: 5px 12px; vertical-align: top; }
#content details.props th { width: 110px; color: var(--muted); font-weight: 600; white-space: nowrap; }
#content details.props tr:last-child th, #content details.props tr:last-child td { border-bottom: none; }
#content details.props .chip { display: inline-block; margin: 1px 4px 1px 0; padding: 0 8px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }

/* ===== [CALLOUT] 옵시디언 콜아웃 > [!종류] ===== */
#content blockquote.callout .callout-title { display: block; font-weight: 700; color: var(--text); margin-bottom: 2px; }
#content blockquote.callout-warning, #content blockquote.callout-caution, #content blockquote.callout-danger {
  border-left-color: #d97706; background: #fff7ed;
}
#content blockquote.callout-success, #content blockquote.callout-tip, #content blockquote.callout-check {
  border-left-color: #16a34a; background: #f0fdf4;
}

/* ===== [TABLE] 표가 화면보다 넓으면 표만 옆으로 스크롤 (페이지 전체가 밀리지 않게) ===== */
#content .tbl-wrap { overflow-x: auto; margin: 12px 0; max-width: 100%; }
#content .tbl-wrap > table { margin: 0; }

/* ===== [IMG] 본문 그림 + 클릭 확대 ===== */
#content img { max-width: 100%; height: auto; display: block; margin: 12px 0; border: 1px solid var(--border); border-radius: 6px; cursor: zoom-in; }
#lightbox { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.88); overflow: auto; }
#lightbox.open { display: block; }
#lightbox img { display: block; max-width: 96vw; max-height: 94vh; margin: 3vh auto; background: #fff; cursor: zoom-in; }
#lightbox img.full { max-width: none; max-height: none; margin: 0; cursor: zoom-out; }

/* ===== [BACKDROP] 모바일 사이드바 배경 ===== */
#backdrop {
  display: none; position: fixed; inset: var(--header-h) 0 0 0;
  background: rgba(0,0,0,0.35); z-index: 15;
}

/* ===== [HOME] 목록 페이지 ===== */
.home-group { margin-bottom: 22px; }
.home-group h2 {
  font-size: 15px; margin-bottom: 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.05em; border: none; padding-top: 0;
}
.home-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.home-card {
  display: block; text-align: left; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--text);
  cursor: pointer; text-decoration: none;
}
.home-card:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

/* ===== [RESPONSIVE] 모바일 ===== */
@media (max-width: 760px) {
  #menuBtn { display: block; }
  #sidebar { transform: translateX(-100%); transition: transform .2s; }
  #sidebar.open { transform: translateX(0); }
  #backdrop.open { display: block; }
  main { margin-left: 0; padding: calc(var(--header-h) + 16px) 14px 60px; }
  #content { padding: 20px 18px; border-radius: 8px; }
}
</style>
</head>
<body>

<header>
  <button id="menuBtn" aria-label="메뉴">&#9776;</button>
  <h1>AI 정보통합 대시보드</h1>
  <button id="homeBtn">🏠 목록</button>
</header>

<nav id="sidebar"></nav>
<div id="backdrop"></div>

<main>
  <div id="content">불러오는 중…</div>
</main>

<script>
/* ===== [STATE] 전역 상태 ===== */
const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');
const backdrop = document.getElementById('backdrop');
let groups = [];
let activeGi = -1;
let activeIi = -1;
const collapsedGroups = new Set(); /* 기본값: 전부 접힘 */
let tocOpen = false; /* 선택한 문서의 목차 펼침 여부 (기본 접힘, 문서를 새로 열 때마다 접힘으로 초기화) */
let searchQuery = '';
let searchBody = false;
let indexing = false;
const docCache = {}; /* file -> text (본문 검색용 캐시) */

/* ===== [INIT] files.json 로드 ===== */
async function init() {
  try {
    const res = await fetch('files.json?' + Date.now());
    groups = (await res.json()).groups;
  } catch (e) {
    content.textContent = 'files.json을 불러오지 못했습니다.';
    return;
  }
  groups.forEach((g, gi) => collapsedGroups.add(gi)); /* 전부 접힌 상태로 시작 */
  renderSidebar();
  if (groups.length && groups[0].items.length) openItem(0, 0);
}

/* ===== [SEARCH] 검색어 매칭 ===== */
function matchesItem(item) {
  const q = searchQuery.trim().toLowerCase();
  if (!q) return true;
  if (item.title.toLowerCase().includes(q)) return true;
  if (searchBody && docCache[item.file] && docCache[item.file].toLowerCase().includes(q)) return true;
  return false;
}

/* ===== [SEARCH] 본문 전체 인덱싱 (최초 1회) ===== */
async function ensureIndexed() {
  if (Object.keys(docCache).length > 0) return;
  indexing = true;
  renderSidebar();
  const tasks = [];
  groups.forEach(g => g.items.forEach(item => {
    tasks.push(
      fetch(item.file + '?' + Date.now())
        .then(r => r.text())
        .then(t => { docCache[item.file] = t; })
        .catch(() => { docCache[item.file] = ''; })
    );
  }));
  await Promise.all(tasks);
  indexing = false;
  renderSidebar();
}

/* ===== [SIDEBAR] 그룹+아이템 렌더 ===== */
function renderSidebar() {
  const prevInput = document.getElementById('searchInput');
  const hadFocus = !!prevInput && document.activeElement === prevInput;
  const selStart = hadFocus ? prevInput.selectionStart : null;
  const selEnd = hadFocus ? prevInput.selectionEnd : null;

  sidebar.innerHTML = '';

  /* 검색창 */
  const searchWrap = document.createElement('div');
  searchWrap.id = 'searchWrap';
  const input = document.createElement('input');
  input.id = 'searchInput';
  input.placeholder = indexing ? '본문 인덱싱 중…' : '검색어 입력…';
  input.value = searchQuery;
  input.disabled = indexing;
  input.oninput = (e) => {
    searchQuery = e.target.value;
    if (!e.isComposing) renderSidebar();
  };
  input.addEventListener('compositionend', (e) => {
    searchQuery = e.target.value;
    renderSidebar();
  });
  searchWrap.appendChild(input);

  const optLabel = document.createElement('label');
  optLabel.className = 'search-opt';
  const optCheck = document.createElement('input');
  optCheck.type = 'checkbox';
  optCheck.checked = searchBody;
  optCheck.onchange = async (e) => {
    searchBody = e.target.checked;
    if (searchBody) await ensureIndexed();
    renderSidebar();
  };
  optLabel.appendChild(optCheck);
  optLabel.appendChild(document.createTextNode(' 본문 포함 검색'));
  searchWrap.appendChild(optLabel);
  sidebar.appendChild(searchWrap);

  const isSearching = searchQuery.trim().length > 0;
  let totalMatches = 0;

  groups.forEach((group, gi) => {
    const visibleItems = group.items
      .map((item, ii) => ({ item, ii }))
      .filter(({ item }) => matchesItem(item));

    if (isSearching && visibleItems.length === 0) return; /* 매칭 없는 그룹은 숨김 */
    totalMatches += visibleItems.length;

    const isCollapsed = isSearching ? false : collapsedGroups.has(gi);

    /* 그룹 헤더 */
    const hdr = document.createElement('div');
    hdr.className = 'group-header';
    const arrow = document.createElement('span');
    arrow.className = 'group-arrow' + (isCollapsed ? '' : ' open');
    arrow.textContent = '▶';
    hdr.appendChild(arrow);
    hdr.appendChild(document.createTextNode(' ' + group.title));
    hdr.onclick = () => toggleGroup(gi);
    sidebar.appendChild(hdr);

    /* 그룹 아이템 */
    const wrap = document.createElement('div');
    wrap.className = 'group-items' + (isCollapsed ? ' collapsed' : '');

    (isSearching ? visibleItems : group.items.map((item, ii) => ({ item, ii }))).forEach(({ item, ii }) => {
      const isActive = gi === activeGi && ii === activeIi;
      const btn = document.createElement('button');
      btn.className = 'cat' + (isActive ? ' active' : '');
      if (isActive) {
        /* 선택된 문서: ▶ 표시, 다시 누르면 목차 접기/펼치기 */
        const caret = document.createElement('span');
        caret.className = 'toc-caret' + (tocOpen ? ' open' : '');
        caret.textContent = '▶';
        btn.appendChild(caret);
        btn.appendChild(document.createTextNode(' ' + item.title));
        btn.onclick = () => { tocOpen = !tocOpen; renderSidebar(); };
      } else {
        btn.textContent = item.title;
        btn.onclick = () => openItem(gi, ii);
      }
      wrap.appendChild(btn);

      if (isActive && tocOpen) {
        const toc = document.createElement('div');
        toc.className = 'toc';
        toc.id = 'toc';
        wrap.appendChild(toc);
      }
    });

    sidebar.appendChild(wrap);
  });

  if (isSearching && totalMatches === 0) {
    const empty = document.createElement('div');
    empty.className = 'search-empty';
    empty.textContent = '검색 결과가 없습니다.';
    sidebar.appendChild(empty);
  }

  if (hadFocus) {
    input.focus();
    input.setSelectionRange(selStart, selEnd);
  }
  buildToc(); /* 목차가 펼쳐져 있으면 채운다 (접힘이면 #toc 자체가 없어 아무 일도 안 함) */
}

/* ===== [TOGGLE] 그룹 접기/펼치기 ===== */
function toggleGroup(gi) {
  if (collapsedGroups.has(gi)) collapsedGroups.delete(gi);
  else collapsedGroups.add(gi);
  renderSidebar();
  if (activeGi === gi) buildToc();
}

/* ===== [LOAD] 선택한 아이템 .md 렌더 ===== */
async function openItem(gi, ii) {
  activeGi = gi; activeIi = ii;
  tocOpen = false; /* 새 문서는 목차 접힌 상태로 시작 */
  collapsedGroups.delete(gi); /* 해당 그룹 자동 펼침 */
  renderSidebar();
  content.textContent = '불러오는 중…';
  let md;
  try {
    const res = await fetch(groups[gi].items[ii].file + '?' + Date.now());
    md = await res.text();
  } catch (e) {
    content.textContent = '문서를 불러오지 못했습니다.';
    return;
  }
  content.innerHTML = renderDoc(md);
  enhanceCallouts(content);
  wrapTables(content);
  buildToc();
  window.scrollTo(0, 0);
  closeMenu();
}

/* ===== [DOC] 문서 렌더: 속성(YAML) 분리 + 옵시디언 문법 정리 ===== */
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* 문서 맨 앞 --- ... --- 블록을 떼어낸다 (그대로 두면 marked가 큰 제목(h2)으로 오해함) */
function splitFrontmatter(md) {
  const m = md.match(/^﻿?---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/);
  if (!m) return { rows: null, body: md };
  const rows = [];
  let cur = null;
  m[1].split(/\r?\n/).forEach(line => {
    const kv = line.match(/^([^\s:#-][^:]*):\s*(.*)$/);
    if (kv) {
      cur = { key: kv[1].trim(), vals: [] };
      const v = kv[2].trim().replace(/^"(.*)"$/, '$1');
      if (v) cur.vals.push(v);
      rows.push(cur);
    } else if (cur && line.trim()) {
      cur.vals.push(line.trim().replace(/^-\s+/, ''));
    }
  });
  return { rows, body: md.slice(m[0].length) };
}

function propsHtml(rows) {
  if (!rows || !rows.length) return '';
  const trs = rows.map(r => {
    const isList = r.key === 'tags' || r.vals.length > 1;
    const cell = isList ? r.vals.map(v => '<span class="chip">' + escHtml(v) + '</span>').join('') : escHtml(r.vals.join(' '));
    return '<tr><th>' + escHtml(r.key) + '</th><td>' + cell + '</td></tr>';
  }).join('');
  return '<details class="props"><summary>속성</summary><table>' + trs + '</table></details>';
}

/* [[문서|표시]] → 표시, [[문서#제목]] → 문서 › 제목, 남은 ![[그림]] → 안내 문구 (코드 안은 건드리지 않음) */
function flattenObsidian(md) {
  return md.split(/(```[\s\S]*?```|`[^`\n]*`)/).map((seg, i) => {
    if (i % 2) return seg;
    return seg
      .replace(/!\[\[([^\]|]+?)(?:\|[^\]]*)?\]\]/g, (_, t) => '*(그림 없음: ' + t + ')*')
      .replace(/(^|[^!])\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g, (_, pre, t, a) => pre + (a || t.replace(/#/g, ' › ')))
      /* "180만~182만" 같은 범위 표기의 ~ 한 개를 marked가 취소선으로 오해해 두 ~ 사이를 통째로 지우고
         뒤의 굵은 글씨·코드 표시까지 깨뜨린다. 옵시디언처럼 ~~두 개만 취소선으로 두고 한 개는 일반 글자로 만든다. */
      .replace(/(^|[^~\\])~(?!~)/g, '$1\\~')
      /* *"따옴표 강조"*와 처럼 뒤에 한글 조사가 붙으면 CommonMark가 강조로 인식 못 해 별표가 그대로 보인다 → 직접 <em>으로 */
      .replace(/(^|[^*\w])\*([“"][^"”*\n]+[”"])\*/g, '$1<em>$2</em>')
      /* **굵게(괄호)**이 / 글자**("따옴표")** 처럼 구두점과 한글이 맞닿은 굵은 글씨도 같은 이유로 인식이 안 된다 → 직접 <strong>으로 */
      .replace(/\*\*([^*\n]*?[\p{P}\p{S}])\*\*(?=[\p{L}\p{N}])/gu, '<strong>$1</strong>')
      .replace(/([\p{L}\p{N}])\*\*([\p{P}\p{S}][^*\n]*?)\*\*/gu, '$1<strong>$2</strong>');
  }).join('');
}

function renderDoc(md) {
  const fm = splitFrontmatter(md);
  return propsHtml(fm.rows) + marked.parse(flattenObsidian(fm.body));
}

/* > [!종류] 제목 → 제목 줄을 굵게, 표시 글자([!abstract])는 제거 */
function enhanceCallouts(root) {
  root.querySelectorAll('blockquote').forEach(bq => {
    const p = bq.firstElementChild;
    if (!p || p.tagName !== 'P') return;
    const m = p.innerHTML.match(/^\s*\[!([A-Za-z]+)\][+-]?\s*/);
    if (!m) return;
    bq.classList.add('callout', 'callout-' + m[1].toLowerCase());
    const rest = p.innerHTML.slice(m[0].length);
    const nl = rest.search(/\n|<br\s*\/?>/);
    const title = nl >= 0 ? rest.slice(0, nl) : rest;
    const tail = nl >= 0 ? rest.slice(nl).replace(/^\s*(?:<br\s*\/?>)?\s*/, '') : '';
    p.innerHTML = '<span class="callout-title">' + title + '</span>' + tail;
  });
}

function wrapTables(root) {
  root.querySelectorAll('table').forEach(t => {
    if (t.parentElement.classList.contains('tbl-wrap') || t.closest('details.props')) return;
    const w = document.createElement('div');
    w.className = 'tbl-wrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
}

/* ===== [LIGHTBOX] 본문 그림 클릭 → 확대 (다시 누르면 원본 크기, 바깥 누르면 닫기) ===== */
const lightbox = document.createElement('div');
lightbox.id = 'lightbox';
const lbImg = document.createElement('img');
lightbox.appendChild(lbImg);
document.body.appendChild(lightbox);
lightbox.addEventListener('click', (e) => {
  if (e.target === lbImg) lbImg.classList.toggle('full');
  else lightbox.classList.remove('open');
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('open'); });
content.addEventListener('click', (e) => {
  const img = e.target.closest('img');
  if (!img) return;
  lbImg.src = img.src;
  lbImg.classList.remove('full');
  lightbox.classList.add('open');
});

/* ===== [HOME] 전체 목록 페이지 ===== */
function renderHome() {
  activeGi = -1; activeIi = -1;
  renderSidebar();
  content.innerHTML = '';

  const title = document.createElement('h1');
  title.textContent = '전체 목록';
  content.appendChild(title);

  groups.forEach((group, gi) => {
    const sec = document.createElement('div');
    sec.className = 'home-group';
    const h2 = document.createElement('h2');
    h2.textContent = group.title;
    sec.appendChild(h2);

    const list = document.createElement('div');
    list.className = 'home-list';
    group.items.forEach((item, ii) => {
      const card = document.createElement('button');
      card.className = 'home-card';
      card.textContent = item.title;
      card.onclick = () => openItem(gi, ii);
      list.appendChild(card);
    });
    sec.appendChild(list);
    content.appendChild(sec);
  });

  window.scrollTo(0, 0);
  closeMenu();
}

/* ===== [TOC] 본문 h2로 목차 생성 ===== */
function buildToc() {
  const toc = document.getElementById('toc');
  if (!toc) return;
  toc.innerHTML = '';
  content.querySelectorAll('h2').forEach((h, n) => {
    const id = 'sec-' + n;
    h.id = id;
    const a = document.createElement('a');
    a.textContent = h.textContent;
    a.href = '#' + id;
    a.onclick = (e) => {
      e.preventDefault();
      document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
      closeMenu();
    };
    toc.appendChild(a);
  });
}

/* ===== [MENU] 모바일 사이드바 토글 ===== */
function closeMenu() {
  sidebar.classList.remove('open');
  backdrop.classList.remove('open');
}
document.getElementById('menuBtn').onclick = () => {
  sidebar.classList.toggle('open');
  backdrop.classList.toggle('open');
};
document.getElementById('homeBtn').onclick = renderHome;
backdrop.onclick = closeMenu;

init();
</script>
</body>
</html>
